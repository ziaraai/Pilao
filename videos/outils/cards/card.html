<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "PA"; src: url("font-a.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "PB"; src: url("font-b.woff2") format("woff2"); font-weight: 100 900; }
  :root { --navy: #011844; --green: #0bdea5; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: "PB", "Liberation Sans", sans-serif; color: var(--navy);
    background: radial-gradient(circle at 20% 15%, #ffffff 0%, #e6eef8 55%, #d6e3f3 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .stripe { position: fixed; left: 0; right: 0; bottom: 0; height: 14px; background: linear-gradient(90deg, #ef4444, #10b981, #3b82f6, #f59e0b, #8b5cf6); }
  .wrap { text-align: center; }
  .logo { width: 980px; opacity: 0; transform: scale(.94); animation: in 900ms ease-out 150ms forwards; }
  .logo.small { width: 620px; }
  .sub { margin-top: 36px; font-size: 54px; font-weight: 600; opacity: 0; transform: translateY(18px); animation: in 700ms ease-out 900ms forwards; }
  .url { margin-top: 26px; font-size: 44px; font-weight: 700; color: #047857; opacity: 0; animation: in 700ms ease-out 1500ms forwards; }
  .hook { font-size: 72px; font-weight: 700; line-height: 1.2; max-width: 1500px; opacity: 0; transform: translateY(18px); animation: in 800ms ease-out 200ms forwards; }
  .hook em { font-style: normal; color: #b91c1c; }
  .items { display: grid; grid-template-columns: repeat(2, 780px); gap: 40px; justify-content: center; }
  .item { border-radius: 22px; padding: 46px 40px; font-size: 50px; font-weight: 700; text-align: left; border: 3px solid; border-left-width: 16px;
          opacity: 0; transform: translateY(24px); animation: in 600ms ease-out forwards; display: flex; align-items: center; gap: 26px; }
  .item span { font-size: 64px; }
  .red { background: #fee2e2; border-color: #fca5a5; border-left-color: #ef4444; color: #991b1b; }
  .green { background: #d1fae5; border-color: #6ee7b7; border-left-color: #10b981; color: #065f46; }
  .blue { background: #dbeafe; border-color: #93c5fd; border-left-color: #3b82f6; color: #1e40af; }
  .amber { background: #fef3c7; border-color: #fcd34d; border-left-color: #f59e0b; color: #92400e; }
  .violet { background: #ede9fe; border-color: #c4b5fd; border-left-color: #8b5cf6; color: #5b21b6; }
  .brand { background: #dcfbf1; border-color: #6ee7b7; border-left-color: #0bdea5; color: #011844; }
  .chap { display: flex; align-items: center; gap: 48px; opacity: 0; transform: translateX(-30px); animation: in 700ms ease-out 150ms forwards; }
  .num { width: 190px; height: 190px; border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 110px; font-weight: 800; border: 4px solid; border-left-width: 18px; }
  .chap h1 { font-size: 92px; margin: 0; text-align: left; }
  .chap p { font-size: 40px; margin: 14px 0 0; text-align: left; color: #334155; font-weight: 500; }
  .corner { position: fixed; top: 46px; left: 60px; width: 260px; opacity: .9; }
  @keyframes in { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="stripe"></div>
<script>
  const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const root = document.getElementById("root");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  if (spec.kind === "logo") {
    root.innerHTML = `<img class="logo${spec.small ? " small" : ""}" src="Pilao_avec_slogan.png">` +
      (spec.sub ? `<div class="sub">${esc(spec.sub)}</div>` : "") +
      (spec.url ? `<div class="url">${esc(spec.url)}</div>` : "");
  } else if (spec.kind === "hook") {
    root.innerHTML = `<img class="corner" src="Pilao_sans_slogan.png"><div class="hook">${spec.html}</div>`;
  } else if (spec.kind === "items") {
    root.innerHTML = `<img class="corner" src="Pilao_sans_slogan.png"><div class="items">` +
      spec.items.map((it, i) => `<div class="item ${it.color}" style="animation-delay:${(spec.delays ? spec.delays[i] : 300 + i * 1300)}ms"><span>${it.icon}</span>${esc(it.text)}</div>`).join("") + `</div>`;
  } else if (spec.kind === "chapter") {
    root.innerHTML = `<img class="corner" src="Pilao_sans_slogan.png"><div class="chap"><div class="num ${spec.color}">${spec.n}</div><div><h1>${esc(spec.title)}</h1>${spec.sub ? `<p>${esc(spec.sub)}</p>` : ""}</div></div>`;
  }
</script>
</body>
</html>
