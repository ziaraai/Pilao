name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: pilao, POSTGRES_PASSWORD: pilao, POSTGRES_DB: pilao_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pilao" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pilao:pilao@localhost:5432/pilao_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: OCR engine (Tesseract, French) and LibreOffice (PDF export)
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          tesseract-ocr tesseract-ocr-fra libreoffice-writer-nogui fonts-liberation
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  images:
    # The production images build, and carry what the application needs at run time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image (api, worker, scheduler)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: pilao-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          build-args: NEXT_PUBLIC_API_URL=https://api.example.invalid
          tags: pilao-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke test of the API image
        run: |
          docker run --rm -e ENVIRONMENT=local pilao-api:ci python -c "from app.ai.prompts import load_prompt; from app.services.dce_analysis import SCHEMA_PATH; assert SCHEMA_PATH.exists(); [load_prompt(p) for p in ('extraction_dce', 'scoring_annonce', 'generation_memoire_chapitre')]"
          docker run --rm pilao-api:ci tesseract --list-langs | grep -qx fra
          docker run --rm pilao-api:ci soffice --version

