name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: pilao, POSTGRES_PASSWORD: pilao, POSTGRES_DB: pilao_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pilao" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pilao:pilao@localhost:5432/pilao_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: OCR engine (Tesseract, French) and LibreOffice (PDF export, ODT/DOC/ODS/XLS)
        # A runner's package mirror can hang for hours (2026-11-05): each try is bounded,
        # and retried, so a stuck download never holds back a deploy.
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::Retries=3 update -qq \
              && sudo timeout 400 apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
                tesseract-ocr tesseract-ocr-fra libreoffice-writer-nogui libreoffice-calc-nogui \
                fonts-liberation; then
              exit 0
            fi
            echo "::warning::package install, attempt $attempt failed: retrying"
            sleep 15
          done
          exit 1
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  images:
    # The production images build, and carry what the application needs at run time.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image (api, worker, scheduler)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: pilao-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          build-args: NEXT_PUBLIC_API_URL=https://api.example.invalid
          tags: pilao-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Smoke test of the API image
        run: |
          docker run --rm -e ENVIRONMENT=local pilao-api:ci python -c "from app.ai.prompts import load_prompt; from app.services.dce_analysis import SCHEMA_PATH; assert SCHEMA_PATH.exists(); [load_prompt(p) for p in ('extraction_dce', 'scoring_annonce', 'generation_memoire_chapitre')]"
          docker run --rm pilao-api:ci tesseract --list-langs | grep -qx fra
          docker run --rm pilao-api:ci soffice --version
          # spreadsheets (BPU, DPGF in .xls / .ods) need Calc in the image, not only Writer
          docker run --rm pilao-api:ci python -c "import io; from openpyxl import Workbook; wb = Workbook(); wb.active.append(['BPU', 1]); b = io.BytesIO(); wb.save(b); from app.documents.convert import soffice_convert; assert soffice_convert(b.getvalue(), 'xlsx', 'pdf').startswith(b'%PDF')"
      - name: Server deployment files (infra/server, ADR-033)
        working-directory: infra/server
        run: |
          touch secrets.env
          PILAO_API_IMAGE=pilao-api:ci PILAO_WEB_IMAGE=pilao-web:ci docker compose config --quiet
          for script in deploy.sh pilao.sh backup.sh; do bash -n "$script"; done

