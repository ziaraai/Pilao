[project]
name = "pilao-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "redis>=5",
  "rq>=1.16",
  "argon2-cffi>=25.1.0",
  "email-validator>=2.3.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "black>=24", "mypy>=1.11"]

[tool.ruff]
line-length = 100
[tool.black]
line-length = 100
[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
