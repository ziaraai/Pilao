services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pilao
      POSTGRES_PASSWORD: pilao
      POSTGRES_DB: pilao
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro  # creates pilao_test for pytest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilao"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pilao
      MINIO_ROOT_PASSWORD: pilao-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 pilao pilao-secret; do sleep 1; done;
      mc mb --ignore-existing local/pilao-local"
  clamav:
    image: clamav/clamav:stable
    ports: ["3310:3310"]
volumes:
  pgdata:
  miniodata:
