# Plesk > Websites & Domains > app.pilao.pro > Apache & nginx Settings:
#   1. uncheck « Proxy mode » (nginx serves the domain itself), so « location / » is allowed;
#   2. paste this whole block into « Additional nginx directives », then OK
#      (a red error means: stop, nothing was changed);
#   3. SSL/TLS Certificates > Let's Encrypt for app.pilao.pro (and redirect HTTP to HTTPS).
# Ports: the ones of infra/server/docker-compose.yml, bound to 127.0.0.1 only.

client_max_body_size 260m;  # DCE deposits up to 250 MB

location /api/ {  # the API, without the /api prefix
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
}

location / {  # the web application
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
